name: Publish APT Repository

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write

jobs:
  publish-apt:
    runs-on: ubuntu-latest

    # Skip pre-releases
    if: "!github.event.release.prerelease"

    steps:
      # ── Extract version from release tag ─────────────────────────────
      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^aptos-cli-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag '$TAG' does not match aptos-cli-vX.Y.Z pattern, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${BASH_REMATCH[1]}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Building .deb packages for version $VERSION"

      # ── Checkout repo (for build scripts) ────────────────────────────
      - name: Checkout release repo
        if: steps.version.outputs.skip != 'true'
        uses: actions/checkout@v6

      # ── Download Linux release archives ──────────────────────────────
      - name: Download Linux x86_64 archive
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.event.release.tag_name }}"
          gh release download "$TAG" \
            --pattern "aptos-cli-${VERSION}-x86_64-unknown-linux-gnu.zip" \
            --dir downloads

      - name: Download Linux ARM64 archive
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.event.release.tag_name }}"
          gh release download "$TAG" \
            --pattern "aptos-cli-${VERSION}-aarch64-unknown-linux-gnu.zip" \
            --dir downloads

      # ── Build .deb packages ──────────────────────────────────────────
      - name: Build amd64 .deb package
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p extract/amd64
          unzip "downloads/aptos-cli-${VERSION}-x86_64-unknown-linux-gnu.zip" -d extract/amd64
          chmod +x .github/workflows/build-scripts/build-deb.sh
          .github/workflows/build-scripts/build-deb.sh extract/amd64/aptos "$VERSION" amd64 debs

      - name: Build arm64 .deb package
        if: steps.version.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p extract/arm64
          unzip "downloads/aptos-cli-${VERSION}-aarch64-unknown-linux-gnu.zip" -d extract/arm64
          chmod +x .github/workflows/build-scripts/build-deb.sh
          .github/workflows/build-scripts/build-deb.sh extract/arm64/aptos "$VERSION" arm64 debs

      # ── Checkout gh-pages branch ─────────────────────────────────────
      - name: Checkout gh-pages branch
        if: steps.version.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      # ── Copy .deb packages into APT pool ─────────────────────────────
      - name: Copy debs into APT repo
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p gh-pages/apt/pool/main
          cp debs/*.deb gh-pages/apt/pool/main/

      # ── Import GPG key and update APT repo ───────────────────────────
      - name: Import GPG key
        if: steps.version.outputs.skip != 'true'
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          # Export the public key for the repo
          GPG_KEY_ID=$(gpg --list-keys --with-colons | awk -F: '/^pub/{found=1} found && /^fpr/{print $10; exit}')
          gpg --export --armor "$GPG_KEY_ID" > gh-pages/apt/aptos.gpg

      - name: Update APT repository indices
        if: steps.version.outputs.skip != 'true'
        env:
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev
          chmod +x .github/workflows/build-scripts/update-apt-repo.sh
          .github/workflows/build-scripts/update-apt-repo.sh gh-pages

      # ── Commit and push to gh-pages ──────────────────────────────────
      - name: Commit and push to gh-pages
        if: steps.version.outputs.skip != 'true'
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update APT repo: aptos-cli ${{ steps.version.outputs.version }}"
          git push origin gh-pages
