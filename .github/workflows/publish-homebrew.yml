name: Publish Homebrew Formula

on:
  release:
    types: [published]

env:
  TAP_REPO: aptos-labs/homebrew-aptos

jobs:
  publish:
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#aptos-cli-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Homebrew formula for version $VERSION"

      - name: Download SHA256SUMS from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "SHA256SUMS" \
            --dir .

      - name: Parse checksums
        id: checksums
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          sha_x86_mac=$(grep "aptos-cli-${VERSION}-x86_64-apple-darwin.zip" SHA256SUMS | cut -d' ' -f1)
          sha_arm_mac=$(grep "aptos-cli-${VERSION}-aarch64-apple-darwin.zip" SHA256SUMS | cut -d' ' -f1)
          sha_x86_linux=$(grep "aptos-cli-${VERSION}-x86_64-unknown-linux-gnu.zip$" SHA256SUMS | cut -d' ' -f1)
          sha_arm_linux=$(grep "aptos-cli-${VERSION}-aarch64-unknown-linux-gnu.zip$" SHA256SUMS | cut -d' ' -f1)

          for name in sha_x86_mac sha_arm_mac sha_x86_linux sha_arm_linux; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "::error::Missing checksum for $name"
              exit 1
            fi
            echo "$name=$val" >> "$GITHUB_OUTPUT"
            echo "$name=$val"
          done

      - name: Generate formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_X86_MAC: ${{ steps.checksums.outputs.sha_x86_mac }}
          SHA_ARM_MAC: ${{ steps.checksums.outputs.sha_arm_mac }}
          SHA_X86_LINUX: ${{ steps.checksums.outputs.sha_x86_linux }}
          SHA_ARM_LINUX: ${{ steps.checksums.outputs.sha_arm_linux }}
        run: |
          mkdir -p Formula
          cat > Formula/aptos.rb << FORMULA
          class Aptos < Formula
            desc "CLI for the Aptos blockchain"
            homepage "https://github.com/aptos-labs/aptos-cli-releases"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              on_intel do
                url "https://github.com/aptos-labs/aptos-cli-releases/releases/download/aptos-cli-v${VERSION}/aptos-cli-${VERSION}-x86_64-apple-darwin.zip"
                sha256 "${SHA_X86_MAC}"
              end
              on_arm do
                url "https://github.com/aptos-labs/aptos-cli-releases/releases/download/aptos-cli-v${VERSION}/aptos-cli-${VERSION}-aarch64-apple-darwin.zip"
                sha256 "${SHA_ARM_MAC}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/aptos-labs/aptos-cli-releases/releases/download/aptos-cli-v${VERSION}/aptos-cli-${VERSION}-x86_64-unknown-linux-gnu.zip"
                sha256 "${SHA_X86_LINUX}"
              end
              on_arm do
                url "https://github.com/aptos-labs/aptos-cli-releases/releases/download/aptos-cli-v${VERSION}/aptos-cli-${VERSION}-aarch64-unknown-linux-gnu.zip"
                sha256 "${SHA_ARM_LINUX}"
              end
            end

            def install
              bin.install "aptos"
            end

            test do
              assert_match "aptos", shell_output("#{bin}/aptos --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' Formula/aptos.rb

          echo "Generated formula:"
          cat Formula/aptos.rb

      - name: Push formula to tap repo
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
          mkdir -p tap-repo/Formula
          cp Formula/aptos.rb tap-repo/Formula/aptos.rb

          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/aptos.rb
          if git diff --cached --quiet; then
            echo "Formula unchanged, nothing to push"
          else
            git commit -m "Update aptos formula to ${VERSION}"
            git push
            echo "Pushed updated formula for version ${VERSION}"
          fi
