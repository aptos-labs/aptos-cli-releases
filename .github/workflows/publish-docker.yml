name: Publish Docker Image

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aptos-labs/aptos-cli

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    if: "!github.event.release.prerelease"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#aptos-cli-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Linux binaries from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.event.release.tag_name }}"
          mkdir -p binaries/amd64 binaries/arm64

          gh release download "$TAG" \
            --pattern "aptos-cli-${VERSION}-x86_64-unknown-linux-gnu.zip" \
            --dir binaries/amd64
          gh release download "$TAG" \
            --pattern "aptos-cli-${VERSION}-aarch64-unknown-linux-gnu.zip" \
            --dir binaries/arm64

          cd binaries/amd64 && unzip *.zip && rm *.zip && chmod +x aptos && cd ../..
          cd binaries/arm64 && unzip *.zip && rm *.zip && chmod +x aptos && cd ../..

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=Aptos CLI
            org.opencontainers.image.description=CLI for the Aptos blockchain
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/aptos-labs/aptos-cli-releases
            org.opencontainers.image.licenses=Apache-2.0
